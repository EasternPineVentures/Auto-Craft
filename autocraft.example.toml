# AutoCraft configuration template.
#
# Copy to `autocraft.toml` (git-ignored) and edit. Every value below is the
# built-in default, so an empty file and no file behave identically.
# Environment variables named AUTOCRAFT_<UPPER_SNAKE> override file values.

[target]
# A window whose title contains any of these (case-insensitive) is a candidate.
title_patterns = ["Luanti", "VoxelLibre"]
# Refuse to inject input unless the target window is the foreground window.
# Turning this off is unsafe and only exists for controlled debugging.
require_foreground = true

[capture]
# Observation rate for the agent loop.
fps = 10.0
# File extension used when saving frames: png, jpg, jpeg or bmp.
format = "png"

[safety]
# Kill switch. Polled with GetAsyncKeyState, never registered globally, so the
# key still reaches the game normally.
emergency_stop_key = "f8"
# Longest a single key or mouse button may stay logically held.
max_key_hold_seconds = 2.0
# Largest absolute per-axis relative mouse delta allowed in one command.
max_mouse_delta = 200
# Minimum spacing between injected input events, in seconds.
min_action_interval = 0.02
# Consecutive safety-blocked actions before the agent loop stops.
max_consecutive_blocks = 5

[paths]
# Root for generated captures and run records.
data_dir = "data"

[observer]
# Address the read-only observer page binds to. Loopback only unless you pass
# --allow-remote on the command line, which also disables the Host check.
host = "127.0.0.1"
port = 8765
# Display frames are downscaled to this width before JPEG encoding. The page
# refreshes an image, it does not stream video; 960 keeps a refresh cheap.
frame_max_width = 960
# Age at which the displayed frame stops being "live" and becomes "recent",
# then "stale". Both are shown on the page as an explicit age in seconds.
frame_live_seconds = 1.0
frame_stale_seconds = 5.0
# How many recent events the timeline keeps.
max_events = 200
# How often the browser polls for a new snapshot, in milliseconds.
poll_ms = 1000

[thoughts]
# Master switch for the expression layer. Thoughts are never operative: this
# only controls whether they are generated and displayed at all.
enabled = true
# Shortest gap between two thoughts, in seconds. This is the floor, not the
# schedule -- probability still decides whether anything is said.
min_interval_seconds = 25.0
# Hard ceiling on how many thoughts may be expressed per minute.
max_per_minute = 3.0
# How many thoughts the history keeps.
history_max = 20

[look]
# Settings for `autocraft look-test`, the LOOK-001 sensorimotor measurement.
# That command injects real mouse movement; every bound on it is here.
#
# Seconds to wait after a movement before capturing the next frame. Too short
# and the capture lands mid-motion; too long and unrelated animation changes
# the scene instead.
settle_seconds = 0.15
# Coarse partition for the difference map written into the record and drawn on
# the observer page.
block_grid = 8
# Hard ceiling on planned trials in one look-test run. LOOK-001 has no
# unbounded mode.
max_steps = 10
# Window area above which look-test warns that the target is bigger than the
# recommended 1280x720. It warns; it never resizes your game window.
large_window_pixels = 921600
# Injected mouse deltas, in counts, tried in both directions by
# --calibrate-horizontal and --calibrate-vertical. The series has to bracket the
# answer, and no entry may exceed max_mouse_delta, or the whole series is
# refused before anything is sent.
calibration_deltas = [5, 10, 25, 50, 100, 200]

[perception]
# Settings for `autocraft perceive-test` (VISION-001) and for the perception
# decision policy. Nothing here causes any input to be sent: perceive-test has
# no --yes flag and never moves the mouse. These values bound how the layer
# *learns* what the scene normally does, which is what lets it tell a real
# change from the scene's own animation.
#
# Partition the frame is read through. 16x16 gives 256 cells: coarse enough that
# a cell holds real texture rather than one noisy pixel, fine enough that a
# small on-screen change still lands in its own cell.
grid = 16
# Robust standard deviations above a cell's own typical frame-to-frame movement
# before that cell counts as changed. The spread itself is learned per cell from
# this run's frames; this is only the multiplier.
sigma = 4.0
# Luma levels. No learned bound may fall below this. Without a floor, a cell
# that sat perfectly still during learning would get a bound of zero and then
# flag every later frame as changed.
floor = 2.0
# Frames the layer learns "normal" from before it reports anything. A run
# shorter than this never leaves the learning phase, and says so rather than
# reporting numbers it cannot support.
fit_frames = 20
# Per frame, how far an *unchanged* cell's learned baseline drifts toward what
# it currently sees. This is what lets the model follow slow lighting change
# instead of treating it as a change forever. Cells that are currently flagged
# as changed keep their baseline, so real motion cannot desensitise the model.
adapt_rate = 0.05


[wake]
# Settings for `autocraft wake-test` (WAKE-001): wake up, look around, notice a
# visually salient region, turn toward it, centre it, and stop.
#
# wake-test DOES send mouse input. It refuses to run without --yes, it prints
# its full movement budget first, and the emergency stop key works throughout.
#
# These values are budgets and thresholds, never promises. Every one of them is
# a ceiling, because the milestone requires that a run always terminates. There
# is deliberately no way to disable a bound.
#
# Cells per axis for the salience map. 8 is coarse on purpose: this layer is
# attention, not measurement. It has to say *roughly where* something stands
# out; the pixel-accurate part is done afterwards by template matching.
salience_grid = 8
# Cells per axis for the view fingerprint, which decides whether two looks are
# the same view. A fingerprint says "this looks like a view I saw recently" and
# never "this is the same place in the world".
view_grid = 8
# One deliberate look-around step, in mouse counts. A count is not a pixel:
# LOOK-001 never measured how far a count moves the view, so the behaviour
# re-measures after every single movement rather than assuming this reached
# anywhere in particular.
scan_counts = 60
# SCANNING's movement budget. Twelve deliberate looks is enough to visit the
# eight compass directions plus the starting view twice over.
max_scan_moves = 12
# How many candidate regions may be attempted before the run reports failure.
# Three, because the point is to stop rather than to keep trying: one failed
# target must not be allowed to consume the whole run.
max_target_candidates = 3
# CENTERING's movement budget *per candidate*. Eight closed-loop corrections is
# enough to converge from anywhere on screen at any mapping LOOK-001 could not
# rule out, with room for an overshoot and its correction.
max_center_moves = 8
# Total movement budget for the run, across scanning and every candidate. This
# is the outermost bound and the one the safety story rests on.
max_moves = 45
# Wall-clock ceiling, in seconds. A movement budget alone does not bound time: a
# window that took a second to capture would let 45 movements take 45 seconds.
max_seconds = 120.0
# How close to the frame centre, in pixels, counts as centred. This is a
# tolerance the motor layer can actually hit, not a target it would dither
# around forever.
dead_zone_px = 12.0
# Below this match confidence the selected region is treated as lost rather than
# believed. This is the floor against inventing a target location: a matcher
# always answers something, even when the region is gone.
min_target_confidence = 0.35