# AutoCraft configuration template.
#
# Copy to `autocraft.toml` (git-ignored) and edit. Every value below is the
# built-in default, so an empty file and no file behave identically.
# Environment variables named AUTOCRAFT_<UPPER_SNAKE> override file values.

[target]
# A window whose title contains any of these (case-insensitive) is a candidate.
title_patterns = ["Luanti", "VoxelLibre"]
# Refuse to inject input unless the target window is the foreground window.
# Turning this off is unsafe and only exists for controlled debugging.
require_foreground = true

[capture]
# Observation rate for the agent loop.
fps = 10.0
# File extension used when saving frames: png, jpg, jpeg or bmp.
format = "png"

[safety]
# Kill switch. Polled with GetAsyncKeyState, never registered globally, so the
# key still reaches the game normally.
emergency_stop_key = "f8"
# Longest a single key or mouse button may stay logically held.
max_key_hold_seconds = 2.0
# Largest absolute per-axis relative mouse delta allowed in one command.
max_mouse_delta = 200
# Minimum spacing between injected input events, in seconds.
min_action_interval = 0.02
# Consecutive safety-blocked actions before the agent loop stops.
max_consecutive_blocks = 5

[paths]
# Root for generated captures and run records.
data_dir = "data"

[observer]
# Address the read-only observer page binds to. Loopback only unless you pass
# --allow-remote on the command line, which also disables the Host check.
host = "127.0.0.1"
port = 8765
# Display frames are downscaled to this width before JPEG encoding. The page
# refreshes an image, it does not stream video; 960 keeps a refresh cheap.
frame_max_width = 960
# Age at which the displayed frame stops being "live" and becomes "recent",
# then "stale". Both are shown on the page as an explicit age in seconds.
frame_live_seconds = 1.0
frame_stale_seconds = 5.0
# How many recent events the timeline keeps.
max_events = 200
# How often the browser polls for a new snapshot, in milliseconds.
poll_ms = 1000

[thoughts]
# Master switch for the expression layer. Thoughts are never operative: this
# only controls whether they are generated and displayed at all.
enabled = true
# Shortest gap between two thoughts, in seconds. This is the floor, not the
# schedule -- probability still decides whether anything is said.
min_interval_seconds = 25.0
# Hard ceiling on how many thoughts may be expressed per minute.
max_per_minute = 3.0
# How many thoughts the history keeps.
history_max = 20

[look]
# Settings for `autocraft look-test`, the LOOK-001 sensorimotor measurement.
# That command injects real mouse movement; every bound on it is here.
#
# Seconds to wait after a movement before capturing the next frame. Too short
# and the capture lands mid-motion; too long and unrelated animation changes
# the scene instead.
settle_seconds = 0.15
# Coarse partition for the difference map written into the record and drawn on
# the observer page.
block_grid = 8
# Hard ceiling on planned trials in one look-test run. LOOK-001 has no
# unbounded mode.
max_steps = 10
# Window area above which look-test warns that the target is bigger than the
# recommended 1280x720. It warns; it never resizes your game window.
large_window_pixels = 921600
# Injected mouse deltas, in counts, tried in both directions by
# --calibrate-horizontal and --calibrate-vertical. The series has to bracket the
# answer, and no entry may exceed max_mouse_delta, or the whole series is
# refused before anything is sent.
calibration_deltas = [5, 10, 25, 50, 100, 200]
